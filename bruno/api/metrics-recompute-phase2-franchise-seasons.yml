info:
  name: metrics-recompute-phase2-franchise-seasons
  type: http
  seq: 21

# PHASE 2 of the metrics recompute campaign — run ONLY after phase 1's
# gates pass (docs/audit/competition-metrics-formula-audit.md): the
# season aggregation reads persisted CompetitionMetric rows, so ordering
# is load-bearing. Relayed via the API's AdminOpsProxy ("franchise-seasons"
# family already allowlisted); sport resolves from the route segments.
# NOTE: aggregates FBS franchise seasons only (handler filter).
http:
  method: POST
  url: "{{baseUrlApi}}/admin/ops/producer/football/ncaa/franchise-seasons/seasonYear/2025/metrics/generate"
  headers:
    - name: X-Admin-Token
      value: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
