server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Single-page app: serve index.html for all routes
    location / {
        include security-headers.conf;

        try_files $uri $uri/ /index.html;
    }

    # Long-cache ONLY Vite's fingerprinted output (build/assets/*) — a
    # changed file gets a new hash, so immutable is safe there and only
    # there. Files copied verbatim from public/ (gallery screenshots,
    # robots.txt) keep their names when replaced in place, so they must
    # revalidate: an immutable year would pin returning visitors to old
    # screenshots (PR #753 review).
    location ^~ /assets/ {
        include security-headers.conf;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Un-fingerprinted static files (gallery images, icons): cheap 304
    # revalidation instead of a pinned copy.
    location ^~ /gallery/ {
        include security-headers.conf;

        add_header Cache-Control "no-cache";
    }

    # Don't cache index.html — it is the pointer to the hashed assets
    location = /index.html {
        include security-headers.conf;

        add_header Cache-Control "no-cache";
    }
}
