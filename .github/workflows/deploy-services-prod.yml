name: Deploy Services to Production (Manual)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      api_tag:
        description: 'API image tag (e.g., 1347)'
        required: false
        type: string
      producer_tag:
        description: 'Producer image tag (e.g., 1343)'
        required: false
        type: string
      provider_tag:
        description: 'Provider image tag (e.g., 1344)'
        required: false
        type: string
      jobs_dashboard_tag:
        description: 'Jobs Dashboard image tag (e.g., 1350)'
        required: false
        type: string
      notification_tag:
        description: 'Notification image tag (e.g., 1351)'
        required: false
        type: string
      metricbot_tag:
        description: 'MetricBot image tag (e.g., 1352)'
        required: false
        type: string

# Both this workflow and deploy-services-prod-auto.yml commit and push
# sports-data-config. Serialize them so concurrent runs cannot race the
# push or drop a distinct pending image bump.
concurrency:
  group: sports-data-config-prod-update
  cancel-in-progress: false

jobs:
  update-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sports-data-config repo
        uses: actions/checkout@v5
        with:
          repository: jrandallsexton/sports-data-config
          token: ${{ secrets.GH_PAT }}
          path: sports-data-config

      - name: Update API image tag
        if: ${{ inputs.api_tag != '' }}
        working-directory: sports-data-config
        run: |
          # Update or add image to api-patch.yaml
          if grep -q "image:" app/overlays/04_prod/api-patch.yaml; then
            sed -i "s|image: .*|image: sportdeets.azurecr.io/sportsdataapi:${{ inputs.api_tag }}|g" app/overlays/04_prod/api-patch.yaml
          else
            sed -i '/- name: api-all/a\        image: sportdeets.azurecr.io/sportsdataapi:${{ inputs.api_tag }}' app/overlays/04_prod/api-patch.yaml
          fi
          echo "Updated API to tag: ${{ inputs.api_tag }}"

      - name: Update Producer image tag
        if: ${{ inputs.producer_tag != '' }}
        working-directory: sports-data-config
        run: |
          TAG='${{ inputs.producer_tag }}'
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::producer_tag contains invalid characters: $TAG"
            exit 1
          fi
          # Update all producer role patch files (worker, ingest, api, daemon) for NCAA, NFL, and MLB.
          # Daemon patches exist for ALL THREE sports as of 2026-08-06 (football
          # daemons shipped for NFL preseason; sports-data-config commit 7a71f5e).
          # The missing-file guard below fails the deploy if any is absent.
          # Must stay in sync with deploy-services-prod-auto.yml.
          for patch in producer-patch.yaml producer-ncaa-daemon-patch.yaml producer-ingest-patch.yaml producer-api-patch.yaml producer-nfl-patch.yaml producer-nfl-daemon-patch.yaml producer-nfl-ingest-patch.yaml producer-nfl-api-patch.yaml producer-mlb-patch.yaml producer-mlb-ingest-patch.yaml producer-mlb-api-patch.yaml producer-mlb-daemon-patch.yaml; do
            FILE="app/overlays/04_prod/$patch"
            if [ ! -f "$FILE" ]; then
              echo "::error::Missing producer patch file: $FILE"
              exit 1
            fi
            sed -i "s|image: .*sportsdataproducer.*|image: sportdeets.azurecr.io/sportsdataproducer:${TAG}|g" "$FILE"
            if ! grep -q "sportsdataproducer:${TAG}" "$FILE"; then
              echo "::error::Failed to update image tag in $FILE"
              exit 1
            fi
            echo "Updated $patch to tag: ${TAG}"
          done

      - name: Update Provider image tag
        if: ${{ inputs.provider_tag != '' }}
        working-directory: sports-data-config
        run: |
          TAG='${{ inputs.provider_tag }}'
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::provider_tag contains invalid characters: $TAG"
            exit 1
          fi
          # Update all provider role patch files (worker, ingest, api) for NCAA, NFL, and MLB
          for patch in provider-patch.yaml provider-ingest-patch.yaml provider-api-patch.yaml provider-nfl-patch.yaml provider-nfl-ingest-patch.yaml provider-nfl-api-patch.yaml provider-mlb-patch.yaml provider-mlb-ingest-patch.yaml provider-mlb-api-patch.yaml; do
            FILE="app/overlays/04_prod/$patch"
            if [ ! -f "$FILE" ]; then
              echo "::error::Missing provider patch file: $FILE"
              exit 1
            fi
            sed -i "s|image: .*sportsdataprovider.*|image: sportdeets.azurecr.io/sportsdataprovider:${TAG}|g" "$FILE"
            if ! grep -q "sportsdataprovider:${TAG}" "$FILE"; then
              echo "::error::Failed to update image tag in $FILE"
              exit 1
            fi
            echo "Updated $patch to tag: ${TAG}"
          done

      - name: Update Jobs Dashboard image tag
        if: ${{ inputs.jobs_dashboard_tag != '' }}
        working-directory: sports-data-config
        run: |
          TAG='${{ inputs.jobs_dashboard_tag }}'
          if [[ ! "$TAG" =~ ^[0-9]+$ ]]; then
            echo "::error::jobs_dashboard_tag must be a numeric build tag"
            exit 1
          fi
          # Update or add image to jobs-dashboard-patch.yaml
          if grep -q "image:" app/overlays/04_prod/jobs-dashboard-patch.yaml; then
            sed -i "s|image: .*|image: sportdeets.azurecr.io/sportsdatajobsdashboard:${TAG}|g" app/overlays/04_prod/jobs-dashboard-patch.yaml
          else
            sed -i '/- name: jobs-dashboard/a\        image: sportdeets.azurecr.io/sportsdatajobsdashboard:'"$TAG" app/overlays/04_prod/jobs-dashboard-patch.yaml
          fi
          echo "Updated Jobs Dashboard to tag: $TAG"

      - name: Update Notification image tag
        if: ${{ inputs.notification_tag != '' }}
        working-directory: sports-data-config
        run: |
          TAG='${{ inputs.notification_tag }}'
          if [[ ! "$TAG" =~ ^[0-9]+$ ]]; then
            echo "::error::notification_tag must be a numeric build tag"
            exit 1
          fi
          # Update or add image to notification-patch.yaml
          if grep -q "image:" app/overlays/04_prod/notification-patch.yaml; then
            sed -i "s|image: .*|image: sportdeets.azurecr.io/sportsdatanotification:${TAG}|g" app/overlays/04_prod/notification-patch.yaml
          else
            sed -i '/- name: notification/a\        image: sportdeets.azurecr.io/sportsdatanotification:'"$TAG" app/overlays/04_prod/notification-patch.yaml
          fi
          echo "Updated Notification to tag: $TAG"


      - name: Update MetricBot image tag
        if: ${{ inputs.metricbot_tag != '' }}
        working-directory: sports-data-config
        env:
          # Via env, never interpolated into the script body: this job
          # checks out sports-data-config with GH_PAT, so a crafted input
          # interpolated into shell would run with deploy credentials.
          METRICBOT_TAG: ${{ inputs.metricbot_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$METRICBOT_TAG" =~ ^[0-9]+$ ]]; then
            echo "::error::metricbot_tag must be a numeric build tag"
            exit 1
          fi

          PATCH=app/overlays/04_prod/metricbot-patch.yaml
          if [ ! -f "$PATCH" ]; then
            echo "::error::$PATCH not found"
            exit 1
          fi

          IMAGE="sportdeets.azurecr.io/sportsdatametricbot:${METRICBOT_TAG}"
          # Anchored to the metricbot container block so the edit cannot
          # rewrite unrelated image lines.
          sed -i "s|image: sportdeets.azurecr.io/sportsdatametricbot:.*|image: ${IMAGE}|g" "$PATCH"

          if ! grep -q "image: ${IMAGE}" "$PATCH"; then
            echo "::error::Failed to set MetricBot image to ${IMAGE} in $PATCH"
            exit 1
          fi
          echo "Updated MetricBot to tag: ${METRICBOT_TAG}"
      - name: Commit and push changes
        working-directory: sports-data-config
        env:
          # Passed via env (not interpolated into the script) so a crafted
          # input cannot execute during commit-message construction.
          METRICBOT_TAG_SAFE: ${{ inputs.metricbot_tag }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add app/overlays/04_prod/*.yaml
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COMMIT_MSG="Deploy to production:"
            [ -n "${{ inputs.api_tag }}" ] && COMMIT_MSG="$COMMIT_MSG API=${{ inputs.api_tag }}"
            [ -n "${{ inputs.producer_tag }}" ] && COMMIT_MSG="$COMMIT_MSG Producer=${{ inputs.producer_tag }}"
            [ -n "${{ inputs.provider_tag }}" ] && COMMIT_MSG="$COMMIT_MSG Provider=${{ inputs.provider_tag }}"
            [ -n "${{ inputs.jobs_dashboard_tag }}" ] && COMMIT_MSG="$COMMIT_MSG JobsDashboard=${{ inputs.jobs_dashboard_tag }}"
            [ -n "${{ inputs.notification_tag }}" ] && COMMIT_MSG="$COMMIT_MSG Notification=${{ inputs.notification_tag }}"
            [ -n "${METRICBOT_TAG_SAFE:-}" ] && COMMIT_MSG="$COMMIT_MSG MetricBot=${METRICBOT_TAG_SAFE}"
            
            git commit -m "$COMMIT_MSG"
            git push
            
            echo "✅ Changes committed to sports-data-config. Flux will deploy automatically."
          fi

  smoke-tests:
    needs: update-tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sports-data repo
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wait for Flux reconciliation and pod rollout
        run: |
          echo "Waiting 5m30s for Flux to reconcile and pods to roll out..."
          sleep 330

      - name: Run smoke tests
        env:
          SMOKE_TEST_BASE_URL: https://api.sportdeets.com
          SMOKE_TEST_API_KEY: ${{ secrets.SMOKE_TEST_API_KEY }}
        run: dotnet test test/smoke/SportsData.Api.Tests.Smoke/ --verbosity normal
