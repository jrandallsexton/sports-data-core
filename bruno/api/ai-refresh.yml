info:
  name: ai-refresh
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrlApi}}/api/synthetics/refresh?week=3"
  headers:
    - name: X-Admin-Token
      value: "{{adminToken}}"
  params:
    - name: week
      value: "3"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
